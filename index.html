<!DOCTYPE html> 
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <main>
<h1>Is it a Palindrome?</h1>
<div class="juntos">
<p class="pre">Enter in text to check for a palindrome:</p>
<input id="text-input"></input>
<button id="check-btn">Check</button>
</div>
<p id="result"></p>
<p id="pista">💡 A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
</main>
<script src="script.js"></script>
</body>
